[project]
name = "roo-fastembed-service"
version = "0.1.0"
description = "OpenAI-compatible embeddings service and direct Qdrant retrieval helpers for Roo indexing."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "fastembed>=0.6.0",
    "httpx>=0.27.0,<1.0.0",
    "pydantic>=2.10.6,<3.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    "qdrant-client>=1.12.0",
    "uvicorn>=0.32.0,<1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[tool.uv]
dev-dependencies = [
    "pytest>=8.3.3",
]

[project.scripts]
roo-fastembed-service = "roo_fastembed_service.main:main"
